name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: kalisi, POSTGRES_PASSWORD: kalisi, POSTGRES_DB: kalisi }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kalisi" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults: { run: { working-directory: backend } }
    env:
      KALISI_DATABASE_URL: postgresql+psycopg://kalisi:kalisi@localhost:5432/kalisi
      KALISI_TEST_DATABASE_URL: postgresql+psycopg://kalisi:kalisi@localhost:5432/kalisi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply and match the models
        run: alembic upgrade head && alembic check
      - name: Tests
        run: pytest -q
      - name: Demo and survey pages build
        run: python3 ../static/build.py --out "$RUNNER_TEMP/static" && test -s "$RUNNER_TEMP/static/survey/index.html"
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
